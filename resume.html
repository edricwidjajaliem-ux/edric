<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume — Edric Lim</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    @view-transition { navigation: auto; }
    @keyframes pagein { from { opacity: 0; } to { opacity: 1; } }
    ::view-transition-old(root) { animation: .18s ease both fadeout; }
    ::view-transition-new(root) { animation: .28s ease both pagein; }
    @keyframes fadeout { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f8f6f1; --ink: #1f4a39; --muted: #5f7a6d; --faint: #93a89d; --accent: #2c5f4a; --line: #dfe5df; }
    html { background: var(--bg); }
    body { background: var(--bg); color: var(--ink); font-family: 'EB Garamond', Georgia, serif; font-size: 18px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    main { max-width: 820px; margin: 0 auto; padding: 56px 24px 72px; }
    a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .15s; }
    a:hover { border-bottom-color: var(--accent); }
    .back { font-size: 16px; color: var(--muted); display: inline-block; margin-bottom: 40px; }
    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1.1; letter-spacing: -0.01em; color: var(--accent); }
    .sub { font-size: 15px; color: var(--faint); margin-top: 2px; }
    .dl { font-size: 16px; font-weight: 500; color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 6px 16px; transition: background .15s, color .15s; }
    .dl:hover { background: var(--accent); color: #fff; border-bottom-color: var(--accent); }
    iframe { opacity: 0; transition: opacity .35s ease; display: block; width: 100%; height: 1100px; border: 1px solid var(--line); border-radius: 4px; background: #fff; box-shadow: 0 6px 24px rgba(31,74,57,.08); }
    @media (max-width: 700px) { main { padding: 40px 16px 56px; } h1 { font-size: 34px; } iframe { height: 75vh; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← Edric Lim</a>
    <div class="head">
      <div>
        <h1>Resume</h1>
        <p class="sub">Last updated October 2026</p>
      </div>
      <a class="dl" href="files/resume.pdf" download="Edric_Lim_Resume.pdf">Download PDF</a>
    </div>
    <iframe src="files/resume.pdf#view=FitH" title="Edric Lim resume" onload="this.style.opacity=1"></iframe>
    <noscript><style>iframe{opacity:1!important}</style></noscript>
  </main>
  <script>setTimeout(function(){var f=document.querySelector("iframe");if(f)f.style.opacity=1;},1500);</script>
</body>
</html>
