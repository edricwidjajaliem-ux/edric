  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f8f6f1; --ink: #1f4a39; --muted: #5f7a6d; --faint: #93a89d; --accent: #2c5f4a; }
    html { background: var(--bg); }
    body { background: var(--bg); color: var(--ink); font-family: 'EB Garamond', Georgia, serif; font-size: 18px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 24px 72px; }
    a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.15s; }
    a:hover { border-bottom-color: var(--accent); }
    .back { font-size: 16px; color: var(--muted); display: inline-block; margin-bottom: 48px; }
    h1 { color: var(--accent); font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 40px; line-height: 1.12; letter-spacing: -0.01em; margin-bottom: 10px; }
    p { color: var(--muted); }
  </style>
</head>
